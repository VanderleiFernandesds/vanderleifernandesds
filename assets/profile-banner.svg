<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Vanderlei Fernandes</title>
  <desc id="desc">Full Stack Developer, Front-End e UI/UX</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1F"/>
      <stop offset="1" stop-color="#111833"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.55" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C084FC" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#CBD5E1" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="300" rx="20"/></clipPath>
    <style>
      .float { animation: float 8s ease-in-out infinite; }
      .float2 { animation: float 10s ease-in-out infinite reverse; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .fade { opacity: 0; animation: fade 1.2s ease-out forwards; }
      .d1 { animation-delay: .15s; } .d2 { animation-delay: .45s; } .d3 { animation-delay: .75s; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
      @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
      @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle class="float" cx="1010" cy="70" r="190" fill="url(#glowA)"/>
    <circle class="float2" cx="1120" cy="260" r="160" fill="url(#glowB)"/>

    <!-- Code window -->
    <g transform="translate(790 66)"><g class="fade d3">
      <rect width="330" height="168" rx="14" fill="#0D1428" stroke="#CBD5E1" stroke-opacity="0.12"/>
      <circle cx="22" cy="22" r="5" fill="#F87171"/>
      <circle cx="40" cy="22" r="5" fill="#FBBF24"/>
      <circle cx="58" cy="22" r="5" fill="#34D399"/>
      <g font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="14">
        <text x="22" y="66" fill="#818CF8">const <tspan fill="#CBD5E1">dev</tspan> <tspan fill="#94A3B8">=</tspan> <tspan fill="#94A3B8">{</tspan></text>
        <text x="40" y="90" fill="#5EEAD4">foco<tspan fill="#94A3B8">:</tspan> <tspan fill="#C084FC">"Front-End + UI/UX"</tspan><tspan fill="#94A3B8">,</tspan></text>
        <text x="40" y="114" fill="#5EEAD4">stack<tspan fill="#94A3B8">:</tspan> <tspan fill="#C084FC">"Full Stack"</tspan><tspan fill="#94A3B8">,</tspan></text>
        <text x="40" y="138" fill="#5EEAD4">base<tspan fill="#94A3B8">:</tspan> <tspan fill="#C084FC">"São Paulo"</tspan></text>
        <text x="22" y="158" fill="#94A3B8">}<tspan class="blink" fill="#5EEAD4">▍</tspan></text>
      </g>
    </g></g>

    <!-- Text -->
    <g font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif">
      <text x="80" y="104" class="fade d1" fill="#94A3B8" font-size="16" letter-spacing="4" font-weight="600">OLÁ, EU SOU</text>
      <text x="78" y="160" class="fade d1" fill="#FFFFFF" font-size="54" font-weight="800" letter-spacing="-1">Vanderlei Fernandes</text>
      <rect x="80" y="182" width="120" height="4" rx="2" fill="url(#accent)" class="fade d2"/>
      <text x="80" y="222" class="fade d2" fill="#CBD5E1" font-size="22" font-weight="500">Full Stack Developer <tspan fill="#5EEAD4">·</tspan> Front-End <tspan fill="#C084FC">·</tspan> UI/UX</text>
    </g>
  </g>
</svg>
