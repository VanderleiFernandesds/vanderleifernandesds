<g class="in" style="animation-delay:.12s"><text x="72" y="210" font-size="25" fill="#424A53">Sou desenvolvedor Full Stack com foco em Front-End e UI/UX,</text><text x="72" y="245" font-size="25" fill="#424A53">formado em Análise e Desenvolvimento de Sistemas (UNICID).</text><text x="72" y="309" font-size="25" fill="#424A53">Gosto de transformar ideias em experiências digitais, unindo</text><text x="72" y="344" font-size="25" fill="#424A53">código, design e performance para criar soluções modernas,</text><text x="72" y="379" font-size="25" fill="#424A53">intuitivas e com propósito.</text></g>
