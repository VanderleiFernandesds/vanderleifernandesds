<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1752 440" width="1752" height="440" role="img" aria-labelledby="t d">
<title id="t">Sobre mim</title>
<desc id="d">Sou desenvolvedor Full Stack com foco em Front-End e UI/UX, formado em Análise e Desenvolvimento de Sistemas (UNICID). Gosto de transformar ideias em experiências digitais, unindo código, design e performance para criar soluções modernas, intuitivas e com propósito. Meus diferenciais: Foco em UI/UX (Interfaces intuitivas e funcionais), Performance (Sites rápidos e otimizados), Visão completa (Front-End e Back-End), Evolução constante (Estudo e prática diária).</desc>
